name: exam_prep
description: Local-first exam preparation app with spaced revision scheduling.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # State management
  provider: ^6.1.2

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.2.5

# package_info_plus is pulled in transitively (by wakelock_plus) at a version
# whose Android build.gradle predates the AGP version used by newer Flutter
# templates, causing "Could not get unknown property 'flutter'" at build
# time. Forcing a newer version here resolves it without touching any
# package we depend on directly.
dependency_overrides:
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
