name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # The repo only has lib/, pubspec.yaml, README.md. This generates the
      # missing android/ platform folder without touching existing files.
      - name: Scaffold platform folders
        run: flutter create . --project-name exam_prep --org com.nothingherebd --platforms=android

      # flutter_local_notifications needs Java 8+ APIs desugared for it to
      # run on older Android versions. flutter create's generated Android
      # build file doesn't enable this by default, and since that file isn't
      # committed to the repo (it's regenerated every run), we patch it here
      # rather than in a tracked file. Recent Flutter versions generate
      # build.gradle.kts (Kotlin DSL) instead of build.gradle (Groovy), so we
      # detect which one exists and use the matching syntax — appending a
      # second android{}/dependencies{} block is valid in both DSLs; Gradle
      # merges it with the one flutter create already wrote.
      - name: Enable core library desugaring
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts << 'EOF'

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
          else
            cat >> android/app/build.gradle << 'EOF'

          android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: exam-prep-apk
          path: build/app/outputs/flutter-apk/app-release.apk
