name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # The repo only has lib/, pubspec.yaml, README.md. This generates the
      # missing android/ platform folder without touching existing files.
      - name: Scaffold platform folders
        run: flutter create . --project-name exam_prep --org com.nothingherebd --platforms=android

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: exam-prep-apk
          path: build/app/outputs/flutter-apk/app-release.apk
